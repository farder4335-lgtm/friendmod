name: Inspect

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate sources
        run: ./gradlew genSources --no-daemon
      - name: Extract info
        shell: bash {0}
        run: |
          mkdir -p /tmp/src && cd /tmp/src
          for J in $(find /home/runner/work -path "*loom-cache/minecraftMaven*" -name "*sources.jar"); do unzip -qo "$J"; done
          {
            echo "### waypoint files"; find . -ipath "*waypoint*" -name "*.java"
            for f in $(find . -ipath "*waypoint*" -name "*.java" | grep -i "client\|TrackedWaypoint\|WaypointTransmitter\|Waypoint.java\|WaypointManager" | head -12); do echo "=================== $f"; grep -v "^import\|^$" $f | head -220; done
            echo "### getWaypointManager"; grep -rn "WaypointManager" net/minecraft/client --include=*.java | head -15
          } > /tmp/inspect.txt
      - name: Publish result to branch
        run: |
          mkdir /tmp/out && cp /tmp/inspect.txt /tmp/out/ && cd /tmp/out
          git init -q -b inspect-output && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "inspect output"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" inspect-output
