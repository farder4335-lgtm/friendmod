name: Inspect

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate sources
        run: ./gradlew genSources --no-daemon
      - name: Extract info
        shell: bash {0}
        run: |
          mkdir -p /tmp/src && cd /tmp/src
          for J in $(find /home/runner/work -path "*loom-cache/minecraftMaven*" -name "*sources.jar"); do echo "jar $J" >> /tmp/jars.txt; unzip -qo "$J"; done
          {
            cat /tmp/jars.txt
            echo "### Player.getDisplayName"; sed -n '1620,1700p' net/minecraft/world/entity/player/Player.java
            echo "### nameTag across client"; grep -rn "nameTag" net/minecraft/client/renderer/entity/ | head -60
            echo "### EntityRenderer name related"; grep -n -B2 -A12 "getNameTag\|shouldShowName\|extractRenderState" net/minecraft/client/renderer/entity/EntityRenderer.java | head -120
            echo "### Avatar/Player renderer"; ls net/minecraft/client/renderer/entity/player/ 2>/dev/null; grep -rn "nameTag\|getDisplayName\|getScoreboardDisplayName" net/minecraft/client/renderer/entity/player/ net/minecraft/client/renderer/entity/LivingEntityRenderer.java 2>/dev/null | head -40
            echo "### tab overlay"; grep -rn -A12 "getNameForDisplay" net/minecraft/client/gui/components/PlayerTabOverlay.java | head -50
            echo "### level players"; grep -n "players()" net/minecraft/client/multiplayer/ClientLevel.java | head
          } > /tmp/inspect.txt
      - name: Publish result to branch
        run: |
          mkdir /tmp/out && cp /tmp/inspect.txt /tmp/out/ && cd /tmp/out
          git init -q -b inspect-output && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "inspect output"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" inspect-output
