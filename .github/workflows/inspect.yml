name: Inspect

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate sources
        run: ./gradlew genSources --no-daemon
      - name: Extract info
        run: |
          JAR=$(find / -name "*sources.jar" -path "*inecraft*" 2>/dev/null | grep -v friendmod | head -n 1)
          echo "sources jar: $JAR"
          mkdir -p /tmp/src && cd /tmp/src && unzip -q "$JAR"
          {
            echo "### jar: $JAR"
            echo "### Entity.getDisplayName"; grep -n -A12 "Component getDisplayName" net/minecraft/world/entity/Entity.java
            echo "### Player/Avatar getDisplayName/getName"; grep -rn "getDisplayName\|Component getName" net/minecraft/world/entity/player/Player.java net/minecraft/world/entity/Avatar.java 2>/dev/null
            echo "### nameTag in renderers"; grep -rn "nameTag\|getNameTag\|shouldShowName" net/minecraft/client/renderer/entity/EntityRenderer.java net/minecraft/client/renderer/entity/player/*.java net/minecraft/client/renderer/entity/state/EntityRenderState.java 2>/dev/null
            echo "### LivingEntity fields"; grep -n "public int hurtTime\|public int hurtDuration\|public boolean swinging\|public int swingTime\|public float attackAnim\|swingTime;" net/minecraft/world/entity/LivingEntity.java
            echo "### tab overlay"; grep -rn -B2 -A14 "getNameForDisplay" net/minecraft/client/gui/components/PlayerTabOverlay.java | head -60
            echo "### level players"; grep -rn "List<AbstractClientPlayer> players\|players()" net/minecraft/client/multiplayer/ClientLevel.java net/minecraft/world/level/Level.java | head
            echo "### GameProfile name"; grep -rn "gameProfile\|getGameProfile" net/minecraft/world/entity/player/Player.java | head -5
          } > /tmp/inspect.txt
      - name: Publish result to branch
        run: |
          mkdir /tmp/out && cp /tmp/inspect.txt /tmp/out/ && cd /tmp/out
          git init -q -b inspect-output && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "inspect output"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" inspect-output
