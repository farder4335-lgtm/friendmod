name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --no-daemon
      - name: Publish jar to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/friendmod-*.jar | grep -v sources | head -n 1)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$JAR" --title "friendmod (latest build)" --notes "Fabric client mod for Minecraft 26.2. Needs Fabric API for 26.2."
